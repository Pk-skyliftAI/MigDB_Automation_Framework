name: MigDB Automation Tests
runs-on: self-hosted
# NOTE: this workflow MUST run on a self-hosted runner. config/config.yaml's
# urls.base_url points at a private on-prem host (192.168.77.130) that a
# GitHub-hosted runner cannot reach. See docs/CI_CD.md for setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest -m marker expression to run"
        required: false
        default: "regression"
      browser:
        description: "Browser to run against (chromium/firefox/webkit)"
        required: false
        default: "chromium"

jobs:
  test:
    runs-on: self-hosted

    env:
      MIGDB_USERNAME: ${{ secrets.MIGDB_USERNAME }}
      MIGDB_PASSWORD: ${{ secrets.MIGDB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium firefox webkit

      - name: Run tests (push / pull_request - smoke only)
        if: github.event_name != 'workflow_dispatch'
        run: pytest -m smoke

      - name: Run tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: pytest -m "${{ github.event.inputs.marker }}" --browser=${{ github.event.inputs.browser }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
