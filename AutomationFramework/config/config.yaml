application:
  name: MIGDB for Oracle

environment:
  name: QA

browser:
  engine: chromium
  headless: true
  slow_mo: 100
  timeout: 30000

urls:
  # App moved again 2026-08-05: from the 108.128.46.58 EC2 instance (had
  # a GoldenGate Manager down issue + on-prem firewall/NAT problem
  # blocking source/target DB connectivity) to a new on-prem server that
  # can reach the on-prem source/target DBs directly - user confirmed
  # "everything is working fine" here.
  base_url: "http://192.168.77.130:8080/?ojr=signin"

credentials:
  username: "admin"
  password: "Welcome1"

secure_vault:

  domain: "SkyliftAI"

  existing_aliases:
    - "SOURCECDB"
    - "TargetDB"         # 2026-08-20: 192.168.77.42 went down, replaced by
                         # new target host 192.168.77.125 (see TROUBLESHOOTING.md
                         # / memory). The old TARGETDB_ROOT (CDB-root) /
                         # TARGETPDB (PDB-scoped) split is gone - rebuilt as
                         # ONE alias, "TargetDB", PDB-scoped
                         # (c##migdb@192.168.77.125:1521/orclpdb - confirmed
                         # live via network login test, same "orclpdb" service
                         # pattern as the old TARGETPDB). Confirmed live via
                         # Secure Vault screen 2026-08-20: only 3 aliases now
                         # exist (SOURCECDB, TargetDB, SOURCEPDB).
                         #
                         # NOT YET RE-VERIFIED: whether Config Tables' View
                         # (which the old CDB-root TARGETDB_ROOT alias was
                         # specifically kept around for - see the OGG-02661
                         # note this replaced) still works through this single
                         # PDB-scoped alias, or needs its own CDB-root alias
                         # added back. Watch for a repeat of that failure mode
                         # once Config Tables is exercised against this host.
    - "SOURCEPDB"

  automation_alias:
    username: "c##migdb@192.168.77.215:1521/orclpdb.localdomain"
    password: "Welcome1"

supplemental_logging:

  default_cdb: SOURCECDB

  # The "Vault Alias" field relabels to "Choose PDB(in CDB Mode)" once a
  # CDB-root alias is selected above, and needs a separate PDB-level
  # vault alias to see PDB-local schemas (e.g. SAMPLE_APP) rather than
  # only CDB-root-level common users.
  pdb_alias: SOURCEPDB

  trandata_schema: "SAMPLE_APP"

config_tables:

  checkpoint_domain: SkyliftAI

  # History: Target -> TargetDB -> TARGETDB_ROOT (2026-08-06) -> back to
  # TargetDB again 2026-08-20, after 192.168.77.42 went down and the target
  # was rebuilt on 192.168.77.125 as a single alias. See
  # secure_vault.existing_aliases note above for the full context and the
  # open question about whether this PDB-scoped alias covers what the old
  # CDB-root TARGETDB_ROOT alias was kept for.
  checkpoint_alias: TargetDB

  # Renamed CKPT -> CKPTS 2026-08-06 - old CKPT/CKPT_LOX were dropped
  # and recreated fresh (had stale RLP1 data from a prior/cloned
  # environment) then the user added the current one as CKPTS. Verified
  # live on 192.168.77.42/ORCLPDB: C##MIGDB.CKPTS + CKPTS_LOX exist,
  # correct GoldenGate checkpoint structure, 0 rows.
  #
  # 2026-08-20: 192.168.77.42 went down and was replaced by a new target
  # host, 192.168.77.125 (c##migdb user rebuilt fresh there - see
  # TROUBLESHOOTING.md/memory). Checkpoint table rebuilt fresh on the
  # new host too, spelled differently this time - CHKPTS, not CKPTS.
  # User-confirmed rename, not a typo - don't "fix" it back.
  checkpoint_table_name: "ORCLPDB.C##MIGDB.CHKPTS"

designer:

  deployment_name: "ORACLE"

  # Real value on the 2026-08-05 on-prem environment - the source PDB is
  # named ORCLPDB1 here (confirmed live via v$pdbs on 192.168.77.251),
  # NOT "ORCLPDB" like every prior environment this session. Don't
  # assume this stays ORCLPDB1 if the environment changes again -
  # re-verify via v$pdbs before trusting it.
  source_pdb_name: "ORCLPDB1"

  capture_schema: "SAMPLE_APP"

  # Renamed again 2026-08-11 - EXDEMO1 was deleted (user-confirmed) and
  # replaced by EXDEMO3, the same rebuild pattern as the 2026-07-31
  # EXDEMO1/RLP2 -> current rename (see migdb-framework-state memory).
  # Confirmed live via Monitor's Extracts section (Lag 0s, Checkpoint
  # Lag 1) before updating this value - don't trust a stale name here
  # without re-checking Monitor first, this environment renames its
  # pipeline more than once per project so far.
  extract_name: "EXDEMO3"

  trail_name: "st"

  # Apply-side (Target Deployment / Target CredentialStore). Switched
  # from "TARGETDB_ROOT" to "TARGETPDB" 2026-08-06 - the CDB-root alias
  # makes Replicat ABEND ("OGG-02661 Replicat is not allowed to log on
  # to the root level database", confirmed real on RLP2) - see
  # secure_vault.existing_aliases note above.
  #
  # 2026-08-20: 192.168.77.42 went down, target rebuilt on 192.168.77.125.
  # TARGETPDB no longer exists - the new (single, PDB-scoped) alias is
  # called TargetDB, confirmed live via the Secure Vault screen. Same
  # underlying requirement as the 2026-08-06 note still applies (needs
  # PDB-scoped, not CDB-root) - TargetDB satisfies that.
  target_alias: "TargetDB"

  # Fixed 2026-08-20 - was "ORCLTGT" (stale, carried over from the dead
  # 192.168.77.42 host, never re-verified). Confirmed live two ways: (1)
  # v$instance/global_name over SSH on 192.168.77.125 both say "ORCL",
  # (2) ran test_create_homogeneous_initial_load live, watched it
  # correctly reach the Target DB step and time out clicking a row named
  # "ORCLTGT ORCLPDB" that doesn't exist, then read the real grid row
  # directly: "ORCL  ORCLPDB  ...  TargetDB-MigDB-for-Oracle...". Same
  # class of gotcha as initial_load.source_db_name's "ORCLDB" vs SID
  # "orcldb" note below - the app's grid "DB Name" isn't always the
  # literal SID, but here it happens to match.
  target_db_name: "ORCL"

  # Target's PDB is unchanged at "ORCLPDB" - confirmed live via v$pdbs on
  # BOTH 192.168.77.42 (pre-outage) and 192.168.77.125 (2026-08-20 rebuild,
  # same PDB name reused) - a separate key on purpose (test_classic_
  # replicat_apply.py previously reused source_pdb_name for both source
  # and target, which only worked by coincidence when both were
  # "ORCLPDB").
  target_pdb_name: "ORCLPDB"

  # Renamed again 2026-08-11 - see extract_name note above. Confirmed
  # live via Monitor's Replicats section (RLP4, Lag 0s, Checkpoint Lag
  # 7/9 across two checks) - this is also the same replicat whose
  # RLP4.prm useridalias was fixed live earlier this session (see
  # docs/TROUBLESHOOTING.md's dep_priv_url/RLP4 entries), so it's
  # confirmed to be a real, currently-running process, not a stale name.
  #
  # Renamed again 2026-08-20: old target host 192.168.77.42 went down,
  # replaced by 192.168.77.125. Replicat rebuilt against the new target
  # alias/checkpoint table there and came up as RLP5 (RLP4 was bound to
  # the dead host's checkpoint table, can't be reused). User-confirmed
  # live value - not yet re-verified by me via Monitor on the new host.
  replicat_name: "RLP5"

  # --- Extract Pump / Classic Replicat creation - NOT live-confirmed ---
  # need confirming with the user before this branch is ever exercised
  # for real - see DesignerPage.add_extract_pump/add_classic_replicat
  # docstrings.
  pump_name: "MIGDBPM"

  remote_trail_name: "rt"

  # See config_tables.checkpoint_table_name note above - renamed to
  # CHKPTS 2026-08-20 on the new 192.168.77.125 target host.
  checkpoint_table: "ORCLPDB.C##MIGDB.CHKPTS"

initial_load:

  deployment_name: "ORACLE"

  # Must be a PDB-level alias (not a CDB-root alias like SOURCECDB,
  # which silently defaults to Oracle's PDB$SEED on this screen).
  source_alias: "SOURCEPDB"

  # See designer.source_pdb_name note above - real value on the
  # 2026-08-05 on-prem environment is ORCLPDB1, not ORCLPDB.
  source_pdb_name: "ORCLPDB1"

  schema: "SAMPLE_APP"

  # Strict 4-character max length on this screen.
  load_name: "LD01"

  target_deployment_name: "ORACLE"

  # Switched to PDB-scoped alias 2026-08-06 - see designer.target_alias
  # note above. Initial Load itself is out of active scope per user
  # instruction, config left in sync anyway.
  #
  # 2026-08-20: TARGETPDB no longer exists (192.168.77.42 outage, target
  # rebuilt on 192.168.77.125 as a single alias) - see
  # secure_vault.existing_aliases / designer.target_alias notes.
  target_alias: "TargetDB"

  # Target's PDB is "ORCLPDB" (no "1"), NOT the same as source_pdb_name
  # ("ORCLPDB1") - a separate key on purpose, same class of bug as
  # designer.target_pdb_name's note (test_homogeneous_initial_load.py
  # was reusing source_pdb_name for the target row lookup too, which
  # made select_target_db_row() search for a row that could never
  # exist - confirmed live 2026-08-06 via a real 30s click timeout).
  target_pdb_name: "ORCLPDB"

  # Real value on 192.168.77.251 is "ORCLDB" (confirmed live via
  # v$database, SID orcldb) - "ORCL" is a separate, unrelated non-CDB
  # instance on the same host (confirmed CDB=NO), not this environment's
  # source at all. This stale "ORCL" value made
  # select_source_db_row()'s row-matching text ("ORCL ORCLPDB1") never
  # match the real grid row ("ORCLDB ORCLPDB1"), causing a real 30s
  # click timeout in test_homogeneous_initial_load.py.
  source_db_name: "ORCLDB"

  # Fixed 2026-08-20 - see designer.target_db_name note above (same fix,
  # same live evidence: real grid row is "ORCL ORCLPDB", not "ORCLTGT").
  target_db_name: "ORCL"

  directory_name: "DATA_PUMP_DIR"

execution:
  retries: 1
  workers: 2

reporting:
  screenshots: true
  html_report: true
  video: true
  trace: true